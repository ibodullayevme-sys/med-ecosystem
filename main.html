<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>MedEcosystem</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; cursor: pointer; }
        .card:hover { border-color: #40a9ff; background: #252525; }
        h2, h3 { text-align: center; color: #40a9ff; }
        .hidden { display: none; }
        .back-btn { color: #40a9ff; margin-bottom: 15px; cursor: pointer; font-weight: bold; display: inline-block; }
        p { color: #aaa; font-size: 14px; line-height: 1.4; margin: 6px 0; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; justify-content: center; align-items: center; z-index: 1000; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #1e1e1e; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 20px; border-radius: 14px; border: 1px solid #40a9ff; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 24px; color: #ff4d4f; cursor: pointer; font-weight: bold; }
        .conspect-box { background: #252525; padding: 12px; border-radius: 8px; margin-top: 10px; border-left: 3px solid #ffab00; font-size: 14px; line-height: 1.5; }
        .clinic { color: #ff4d4f; font-size: 13px; margin-top: 10px; border-left: 2px solid #ff4d4f; padding-left: 8px; }
        .usmle { color: #52c41a; font-size: 13px; margin-top: 8px; border-left: 2px solid #52c41a; padding-left: 8px; }
    </style>
</head>
<body>

    <div id="view-courses">
        <h2>MedEcosystem</h2>
        <div class="card" onclick="showSubjects('1')">
            <h3>1-Kurs</h3>
            <p>Anatomiya, Histologiya, Tibbiy kimyo, Lotin tili</p>
        </div>
        <div class="card" onclick="showSubjects('2')">
            <h3>2-Kurs</h3>
            <p>Biokimyo, Normal fiziologiya, Mikrobiologiya</p>
        </div>
        <div class="card" onclick="showSubjects('3')">
            <h3>3-Kurs</h3>
            <p>Pat. anatomiya, Patofiziologiya, Farmakologiya</p>
        </div>
    </div>

    <div id="view-subjects" class="hidden">
        <div class="back-btn" onclick="goBack('view-courses')">← Kurslarga qaytish</div>
        <h2 id="title-subjects"></h2>
        <div id="list-subjects"></div>
    </div>

    <div id="view-topics" class="hidden">
        <div class="back-btn" onclick="goBack('view-subjects')">← Fanlarga qaytish</div>
        <h2 id="title-topics"></h2>
        <div id="list-topics"></div>
    </div>

    <div id="modal-conspect" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modal-title" style="color: #ffab00; text-align: left; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 8px;"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        const subjectsData = {
            '1': ['Anatomiya', 'Histologiya', 'Tibbiy kimyo', 'Lotin tili'],
            '2': ['Biokimyo', 'Normal fiziologiya', 'Mikrobiologiya'],
            '3': ['Patologik anatomiya', 'Patofiziologiya', 'Farmakologiya']
        };

        const topicsData = {
            'Biokimyo': {
                title: '1. Glikoliz va Krebs sikli',
                summary: 'Energiya almashinuvining asosiy bosqichlari.',
                details: '• Glikoliz jarayoni sitoplazmada ketadi.<br>• Krebs sikli mitoxondriya matritsasida sodir boʻladi.',
                clinic: 'Gipoksiya holatida anaerob glikoliz keskin kuchayadi.',
                usmle: 'USMLE: Krebs siklining asosiy regulyatori - izotsitratdegidrogenaza.'
            },
            'Normal fiziologiya': {
                title: '1. Qon ivish sistemasi (Gemostaz)',
                summary: 'Gemostaz mexanizmlari va ivish omillari.',
                details: '• Vaskulyar-trombotsitar gemostaz.<br>• Koagulyatsion gemostaz kaskadi.',
                clinic: 'Gemofiliya kasalligida qon ivish vaqti choʻziladi.',
                usmle: 'USMLE: VIII omil yetishmovchiligi Gemofiliya A ni keltirib chiqaradi.'
            },
            'Mikrobiologiya': {
                title: '1. Bakteriyalar morfologiyasi',
                summary: 'Kokklar, batsillalar va ularning tuzilishi.',
                details: '• Gram-musbat va Gram-manfiy bakteriyalar farqi.<br>• Mikroskopiya usullari.',
                clinic: 'Antibiotiklarga chidamlilik (rezistentlik) muammosi.',
                usmle: 'USMLE: Gram-musbat bakteriyalar qalin peptidoglikan qatlamiga ega.'
            },
            'Anatomiya': {
                title: '1. Vertebra Sacralis',
                summary: 'Dumgʻaza umurtqalari haqida konspekt.',
                details: '• Oʻsmirlikda oʻzaro birikib, os sacrum hosil qiladi.',
                clinic: 'Dumgʻaza suyagi sinishlari nervlarga taʼsir qilishi mumkin.',
                usmle: 'USMLE: Kauda ekvina sindromi.'
            }
        };

        function showSubjects(courseNum) {
            document.getElementById('view-courses').classList.add('hidden');
            document.getElementById('view-subjects').classList.remove('hidden');
            document.getElementById('title-subjectsinnerText'] = courseNum + '-kurs fanlari';
            
            let list = document.getElementById('list-subjects');
            list.innerHTML = '';
            
            let subs = subjectsData[courseNum] || [];
            subs.forEach(sub => {
                list.innerHTML += `<div class="card" onclick="showTopics('${sub}')"><h3>${sub}</h3><p>Konspektlarni ochish →</p></div>`;
            });
        }

        function showTopics(subjectName) {
            document.getElementById('view-subjects').classList.add('hidden');
            document.getElementById('view-topics').classList.remove('hidden');
            document.getElementById('title-topics').innerText = subjectName;
            
            let list = document.getElementById('list-topics');
            list.innerHTML = '';
            
            let topic = topicsData[subjectName] || {
                title: '1. Mavzu tayyorlanmoqda',
                summary: 'Bu fan boʻlimi tez kunda qoʻshiladi.',
                details: 'Tez kunda toʻliq konspektlar joylashtiriladi.',
                clinic: 'Klinik maʼlumotlar qoʻshiladi.',
                usmle: 'USMLE maʼlumotlari tayyorlanmoqda.'
            };

            list.innerHTML += `
                <div class="card" onclick='openModal(${JSON.stringify(topic)})'>
                    <h3 style="color:#40a9ff; text-align: left; font-size: 16px; margin: 0 0 6px 0;">${topic.title}</h3>
                    <p>${topic.summary}</p>
                    <span style="color: #ffab00; font-size: 12px; font-weight: bold;">To'liq konspektni o'qish →</span>
                </div>`;
        }

        function openModal(topic) {
            document.getElementById('modal-title').innerText = topic.title;
            let html = `
                <div class="conspect-box"><b>Konspekt:</b><br>${topic.details}</div>
                <div class="clinic"><b>Klinik jihati:</b> ${topic.clinic}</div>
                <div class="usmle"><b>${topic.usmle}</b></div>
            `;
            document.getElementById('modal-body').innerHTML = html;
            document.getElementById('modal-conspect').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-conspect').classList.add('hidden');
        }

        function goBack(viewId) {
            document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }
    </script>
</body>
</html>
