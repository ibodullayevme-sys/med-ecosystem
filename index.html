<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>MedEcosystem</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .clickable { cursor: pointer; }
        .clickable:hover { border-color: #40a9ff; background: #252525; }
        h2 { text-align: center; color: #40a9ff; }
        .hidden { display: none; }
        .back-btn { color: #40a9ff; margin-bottom: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <!-- 1. Kurslar -->
    <div id="view-courses">
        <h2>Kurslar</h2>
        <div class="card clickable" onclick="showSubjects('1-kurs')"><h3>1-Kurs</h3></div>
        <div class="card clickable" onclick="showSubjects('2-kurs')"><h3>2-Kurs</h3></div>
    </div>

    <!-- 2. Fanlar -->
    <div id="view-subjects" class="hidden">
        <div class="back-btn" onclick="goBack('view-courses')">← Kurslarga</div>
        <h2 id="title-subjects"></h2>
        <div id="list-subjects"></div>
    </div>

    <!-- 3. Mavzular -->
    <div id="view-topics" class="hidden">
        <div class="back-btn" onclick="goBack('view-subjects')">← Fanlarga</div>
        <h2 id="title-topics"></h2>
        <div id="list-topics"></div>
    </div>

    <script>
        // MAVZULAR BAZASI
        const data = {
            '1-kurs': {
                'Anatomiya': ['Suyaklar tizimi', 'Muskullar tizimi', 'Yurak anatomiyasi'],
                'Tibbiy kimyo': ['Eritmalar', 'pH muhit', 'Termodinamika']
            },
            '2-kurs': {
                'Biokimyo': ['Oqsillar almashinuvi', 'Uglevodlar almashinuvi'],
                'Normal fiziologiya': ['Qon fiziologiyasi', 'Nerv tizimi']
            }
        };

        function showSubjects(course) {
            document.getElementById('view-courses').classList.add('hidden');
            document.getElementById('view-subjects').classList.remove('hidden');
            document.getElementById('title-subjects').innerText = course;
            
            let list = document.getElementById('list-subjects');
            list.innerHTML = '';
            for (let sub in data[course]) {
                list.innerHTML += `<div class="card clickable" onclick="showTopics('${course}', '${sub}')"><h3>${sub}</h3></div>`;
            }
        }

        function showTopics(course, subject) {
            document.getElementById('view-subjects').classList.add('hidden');
            document.getElementById('view-topics').classList.remove('hidden');
            document.getElementById('title-topics').innerText = subject;
            
            let list = document.getElementById('list-topics');
            list.innerHTML = '';
            data[course][subject].forEach(topic => {
                list.innerHTML += `<div class="card"><h3>${topic}</h3><p style="color:#aaa">Bu yerda konspekt bo'ladi...</p></div>`;
            });
        }

        function goBack(id) {
            document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
