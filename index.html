<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>MedEcosystem - Anatomiya Bazasi</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .clickable { cursor: pointer; transition: 0.2s; }
        .clickable:hover { border-color: #40a9ff; background: #252525; }
        h2 { text-align: center; color: #40a9ff; }
        .hidden { display: none; }
        .back-btn { color: #40a9ff; margin-bottom: 15px; cursor: pointer; font-weight: bold; display: inline-block; }
        p { color: #aaa; font-size: 14px; line-height: 1.4; margin: 6px 0; }
        .clinic { color: #ff4d4f; font-size: 13px; margin-top: 8px; border-left: 2px solid #ff4d4f; padding-left: 8px; }
    </style>
</head>
<body>
    <!-- 1. Kurslar -->
    <div id="view-courses">
        <h2>MedEcosystem</h2>
        <div class="card clickable" onclick="showSubjects('1-kurs')">
            <h3>1-Kurs</h3>
            <p>Anatomiya (To'liq chuqurlashtirilgan), Histologiya, Tibbiy kimyo</p>
        </div>
        <div class="card clickable" onclick="showSubjects('2-kurs')">
            <h3>2-Kurs</h3>
            <p>Biokimyo, Normal fiziologiya, Mikrobiologiya</p>
        </div>
        <div class="card clickable" onclick="showSubjects('3-kurs')">
            <h3>3-Kurs</h3>
            <p>Pat. anatomiya, Patofiziologiya, Farmakologiya</p>
        </div>
    </div>

    <!-- 2. Fanlar -->
    <div id="view-subjects" class="hidden">
        <div class="back-btn" onclick="goBack('view-courses')">← Kurslarga qaytish</div>
        <h2 id="title-subjects"></h2>
        <div id="list-subjects"></div>
    </div>

    <!-- 3. Mavzular va Klinik ma'lumotlar -->
    <div id="view-topics" class="hidden">
        <div class="back-btn" onclick="goBack('view-subjects')">← Fanlarga qaytish</div>
        <h2 id="title-topics"></h2>
        <div id="list-topics"></div>
    </div>

    <script>
        const data = {
            '1-kurs': {
                'Anatomiya': [
                    { 
                        title: '1. Osteologiya: Suyaklar tizimi va turlari', 
                        text: 'Skelet tuzilishi, suyakning kimyoviy tarkibi (organik va noorganik moddalar), uzun, kalta va yassi suyaklarning morfologiyasi.',
                        clinic: 'Klinik ahamiyati: Osteoporoz, suyak sinishlari, raxit kasalligida suyak zichligining o\'zgarishi.'
                    },
                    { 
                        title: '2. Kalla suyagining tuzilishi (Cranium)', 
                        text: 'Miya va yuz kalla suyaklari, ularning birikish turlari (choklar), bosh suyagi asosining chuqurliklari.',
                        clinic: 'Klinik ahamiyati: Bosh miya jarohatlarida suyak yoriqlari, kalla suyagi ichki bosimining oshishi.'
                    },
                    { 
                        title: '3. Miologiya: Muskullar tizimi va ish mexanizmi', 
                        text: 'Skelet mushaklarining mikroskopik tuzilishi, paylar, fassiyalar va mushak guruhlarining sinergist/antagonist bo\'lib ishlashi.',
                        clinic: 'Klinik ahamiyati: Miopatiyalar, mushak atrofiyalari va tetanus (qoqshol) paytida mushak spazmlari.'
                    },
                    { 
                        title: '4. Yurak-qon tomir tizimi anatomiyasi', 
                        text: 'Yurak devori qatlamlari (epikard, miokard, endokard), o\'ng va chap kameralar, koronar tomirlar, katta va kichik qon aylanish doiralari.',
                        clinic: 'Klinik ahamiyati: Miokard infarkti, yurak nuqsonlari va perikardit patologiyalari.'
                    },
                    { 
                        title: '5. Nafas olish tizimi va o\'pkalar', 
                        text: 'Yuqori nafas yo\'llari, hiqildoq tog\'aylari, traxeya, bronx daraxti va o\'pkaning segmentar tuzilishi.',
                        clinic: 'Klinik ahamiyati: Pnevmoniya, bronxial astma va o\'pka emfizemasida nafas yo\'llarining o\'zgarishi.'
                    },
                    { 
                        title: '6. Ovqat hazm qilish trakti', 
                        text: 'Oshqozon qismlari (tubi, tanasi, pilorik qism), ingichka va yo\'g\'on ichak tuzilishi, jigar va osti bezi topografiyasi.',
                        clinic: 'Klinik ahamiyati: Yara kasalligi, appendisit, gepatit va xolecistit anatomik asoslari.'
                    },
                    { 
                        title: '7. Siydik-tanosil tizimi', 
                        text: 'Buyrakning tuzilishi (kosa-jom sistemasi, nefron topografiyasi), siydik naylari, qovuq.',
                        clinic: 'Klinik ahamiyati: Glomerulonefrit, piyelonefrit va siydik-tosh kasalliklari.'
                    },
                    { 
                        title: '8. Markaziy nerv sistemasi (Bosh va orqa miya)', 
                        text: 'Katta yarimsharlar, miyacha, uzunchoq miya, orqa miyaning kulrang va oq moddasi tuzilishi.',
                        clinic: 'Klinik ahamiyati: Insult (qon quyilishi yoki ishemiya), miya qon aylanishining o\'tkir buzilishlari.'
                    }
                ],
                'Histologiya': [
                    { title: '1. Epiteliy va qon to\'qimasi', text: 'To\'qimalarning umumiy tasnifi va qon hujayralarining gistologik tuzilishi.', clinic: 'Klinik ahamiyati: Anemiya va leykoz tashxislari.' }
                ],
                'Tibbiy kimyo': [
                    { title: '1. Eritmalar va pH muhit', text: 'Bufer sistemalar va osmotik bosim qonunchiligi.', clinic: 'Klinik ahamiyati: Kislota-asos muvozanatining buzilishi (asidoz, alkaloz).' }
                ],
                'Lotin tili': [
                    { title: '1. Anatomik terminologiya', text: 'Lotincha atamalar, kelishiklar va retsept yozish asoslari.', clinic: 'Klinik ahamiyati: Tibbiy hujjatlar va retseptura.' }
                ]
            },
            '2-kurs': {
                'Biokimyo': [
                    { title: '1. Oqsil va uglevod almashinuvi', text: 'Glikoliz va mochevina hosil bo\'lish sikli.', clinic: 'Klinik ahamiyati: Qandli diabet patobioximiyasi.' }
                ],
                'Normal fiziologiya': [
                    { title: '1. Qon fiziologiyasi va gemostaz', text: 'Qon ivish sistemasi va gomeostaz.', clinic: 'Klinik ahamiyati: Trombofiliya va qon oqish kasalliklari.' }
                ],
                'Mikrobiologiya': [
                    { title: '1. Bakteriyalar va viruslar', text: 'Morfologiya va bo\'yalish usullari.', clinic: 'Klinik ahamiyati: Antibiotiklarga rezistentlik.' }
                ]
            },
            '3-kurs': {
                'Patologik anatomiya': [
                    { title: '1. Huayra shikastlanishi va nekroz', text: 'Morfologik o\'zgarishlar.', clinic: 'Klinik ahamiyati: Infarkt va gangrena.' }
                ],
                'Patofiziologiya': [
                    { title: '1. Tipik patologik jarayonlar', text: 'Isitma va gipoksiya.', clinic: 'Klinik ahamiyati: Shok holatlari.' }
                ],
                'Farmakologiya': [
                    { title: '1. Umumiy farmakokinetika', text: 'Dorilarning organizmga ta\'siri.', clinic: 'Klinik ahamiyati: Dori vositalarining nojo\'ya ta\'sirlari.' }
                ]
            }
        };

        function showSubjects(course) {
            document.getElementById('view-courses').classList.add('hidden');
            document.getElementById('view-subjects').classList.remove('hidden');
            document.getElementById('title-subjects').innerText = course.toUpperCase();
            
            let list = document.getElementById('list-subjects');
            list.innerHTML = '';
            for (let sub in data[course]) {
                list.innerHTML += `<div class="card clickable" onclick="showTopics('${course}', '${sub}')"><h3>${sub}</h3><p>Mavzular va klinika tahlilini ko'rish →</p></div>`;
            }
        }

        function showTopics(course, subject) {
            document.getElementById('view-subjects').classList.add('hidden');
            document.getElementById('view-topics').classList.remove('hidden');
            document.getElementById('title-topics').innerText = subject;
            
            let list = document.getElementById('list-topics');
            list.innerHTML = '';
            data[course][subject].forEach(topic => {
                list.innerHTML += `
                    <div class="card">
                        <h3 style="color:#40a9ff">${topic.title}</h3>
                        <p>${topic.text}</p>
                        <div class="clinic"><b>Klinik jihati:</b> ${topic.clinic}</div>
                    </div>`;
            });
        }

        function goBack(id) {
            document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
