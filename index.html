<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>MedEcosystem - Anatomiya To'liq Mundarija</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: white; padding: 15px; margin: 0; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 12px; border: 1px solid #333; }
        .clickable { cursor: pointer; transition: 0.2s; }
        .clickable:hover { border-color: #40a9ff; background: #252525; }
        h2, h3 { text-align: center; color: #40a9ff; }
        .hidden { display: none; }
        .back-btn { color: #40a9ff; margin-bottom: 15px; cursor: pointer; font-weight: bold; display: inline-block; }
        p { color: #aaa; font-size: 14px; line-height: 1.4; margin: 6px 0; }
        .section-title { color: #ffab00; margin-top: 15px; font-size: 16px; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .clinic { color: #ff4d4f; font-size: 13px; margin-top: 8px; border-left: 2px solid #ff4d4f; padding-left: 8px; }
    </style>
</head>
<body>
    <!-- 1. Kurslar -->
    <div id="view-courses">
        <h2>MedEcosystem</h2>
        <div class="card clickable" onclick="showSubjects('1-kurs')">
            <h3>1-Kurs</h3>
            <p>Anatomiya (Mundarija bo'yicha to'liq), Histologiya, Tibbiy kimyo</p>
        </div>
        <div class="card clickable" onclick="showSubjects('2-kurs')">
            <h3>2-Kurs</h3>
            <p>Biokimyo, Normal fiziologiya, Mikrobiologiya</p>
        </div>
        <div class="card clickable" onclick="showSubjects('3-kurs')">
            <h3>3-Kurs</h3>
            <p>Pat. anatomiya, Patofiziologiya, Farmakologiya</p>
        </div>
    </div>

    <!-- 2. Fanlar -->
    <div id="view-subjects" class="hidden">
        <div class="back-btn" onclick="goBack('view-courses')">← Kurslarga qaytish</div>
        <h2 id="title-subjects"></h2>
        <div id="list-subjects"></div>
    </div>

    <!-- 3. Mavzular va Mundarija -->
    <div id="view-topics" class="hidden">
        <div class="back-btn" onclick="goBack('view-subjects')">← Fanlarga qaytish</div>
        <h2 id="title-topics"></h2>
        <div id="list-topics"></div>
    </div>

    <script>
        const data = {
            '1-kurs': {
                'Anatomiya': [
                    // I BO'LIM. OSTEOLOGIA
                    { type: 'header', title: 'I BOʻLIM. OSTEOLOGIA (Suyaklar tizimi)' },
                    { 
                        title: 'Suyak toʻqimasi va naysimon suyak tuzilishi', 
                        text: 'Suyak toʻqimasining mikroskopik tuzilishi, periost pardasi va naysimon suyaklar epifiz, diafiz qismlari.',
                        clinic: 'Klinik jihati: Periostit (suyak pardasi yalligʻlanishi) va suyak oʻsish nuqsonlari.'
                    },
                    { 
                        title: 'Suyaklar tasnifi va tana skeleti', 
                        text: 'Suyaklarning shakliga koʻra turlari (naysimon, yassi, kalta), umurtqa pogʻonasi va koʻkrak qafasi tuzilishi.',
                        clinic: 'Klinik jihati: Skolioz, kifoz kabi umurtqa egriliklari va koʻkrak qafasi deformatsiyalari.'
                    },
                    { 
                        title: 'Qoʻl va oyoq suyaklari skeleti', 
                        text: 'Kurak, oʻmrov, yelka, tirsak, bilak, qoʻl panjasi hamda butun chanoq, son, boldir va oyoq panjasi suyaklari.',
                        clinic: 'Klinik jihati: Chanoq oʻlchamlari patologiyalari, tirsak va boldir suyaklari sinishlari.'
                    },
                    { 
                        title: 'Bosh skeleti (Kalla suyaklari)', 
                        text: 'Peshona, tepa, ensa, gʻalvirsimon, ponasimon, chakka suyaklari, chakka kanallari va yuz qism suyaklari (yuqori va pastki jagʻ).',
                        clinic: 'Klinik jihati: Kalla suyagi yoriqlari, yuz suyaklari jarohatlari va liqildoqlar holati.'
                    },

                    // II BO'LIM. ARTHROLOGIA
                    { type: 'header', title: 'II BOʻLIM. ARTHROLOGIA (Boʻgʻimlar va birikishlar)' },
                    { 
                        title: 'Boʻgʻim komponentlari va turlari', 
                        text: 'Boʻgʻim yuzasi, xaltasi, boʻshligʻi, bosh suyaklarining birikish turlari va choklar.',
                        clinic: 'Klinik jihati: Artrit, artroz va boʻgʻim chiqishlari (dislokatsiya).'
                    },
                    { 
                        title: 'Umurtqalar va koʻkrak qafasining birikishi', 
                        text: 'Umurtqalarning oʻzaro birikishi, chakka-pastki jagʻ boʻgʻimi, qoʻl va oyoq suyaklari birikishlari.',
                        clinic: 'Klinik jihati: Jagʻ boʻgʻimi disfunksiyasi va umurtqalararo disk churrasi (gryja).'
                    },

                    // III BO'LIM. MYOLOGIA
                    { type: 'header', title: 'III BOʻLIM. MYOLOGIA (Mushaklar tizimi)' },
                    { 
                        title: 'Mushak anatomiyasi va yordamchi apparatlari', 
                        text: 'Mushak toʻqimasi, fassiyalar, qinlar, toʻsigʻlar va mexanik xususiyatlari.',
                        clinic: 'Klinik jihati: Miogezoz va fassial boʻshliqlarda yiringli yalligʻlanishlar.'
                    },
                    { 
                        title: 'Bosh, boʻyin va koʻkrak mushaklari', 
                        text: 'Chaynash va mimika mushaklari, boʻyin fassiyalari, koʻkrak mushaklari va diafragma.',
                        clinic: 'Klinik jihati: Diafragma churralari va yuz mushaklari falaji (Bell falaji).'
                    },
                    { 
                        title: 'Qorin, qoʻl va oyoq mushaklari', 
                        text: 'Qorin devori, chov kanali, orqa mushaklari, yelka, bilak, son va boldir mushak-topografiyasi.',
                        clinic: 'Klinik jihati: Chov churralari (grija) va mushak atrofiyalari.'
                    }
                ],
                'Histologiya': [
                    { title: '1. Epiteliy va qon toʻqimasi', text: 'Toʻqimalarning umumiy tasnifi va qon hujayralarining gistologik tuzilishi.', clinic: 'Klinik jihati: Anemiya va leykoz tashxislari.' }
                ],
                'Tibbiy kimyo': [
                    { title: '1. Eritmalar va pH muhit', text: 'Bufer sistemalar va osmotik bosim qonunchiligi.', clinic: 'Klinik jihati: Kislota-asos muvozanatining buzilishi.' }
                ],
                'Lotin tili': [
                    { title: '1. Anatomik terminologiya', text: 'Lotincha atamalar, kelishiklar va retsept yozish asoslari.', clinic: 'Klinik jihati: Tibbiy hujjatlar va retseptura.' }
                ]
            },
            '2-kurs': {
                'Biokimyo': [
                    { title: '1. Oqsil va uglevod almashinuvi', text: 'Glikoliz va mochevina hosil boʻlish sikli.', clinic: 'Klinik jihati: Qandli diabet patobioximiyasi.' }
                ],
                'Normal fiziologiya': [
                    { title: '1. Qon fiziologiyasi va gemostaz', text: 'Qon ivish sistemasi va gomeostaz.', clinic: 'Klinik jihati: Trombofiliya va qon oqish kasalliklari.' }
                ],
                'Mikrobiologiya': [
                    { title: '1. Bakteriyalar va viruslar', text: 'Morfologiya va boʻyalish usullari.', clinic: 'Klinik jihati: Antibiotiklarga rezistentlik.' }
                ]
            },
            '3-kurs': {
                'Patologik anatomiya': [
                    { title: '1. Hujayra shikastlanishi va nekroz', text: 'Morfologik oʻzgarishlar.', clinic: 'Klinik jihati: Infarkt va gangrena.' }
                ],
                'Patofiziologiya': [
                    { title: '1. Tipik patologik jarayonlar', text: 'Isitma va gipoksiya.', clinic: 'Klinik jihati: Shok holatlari.' }
                ],
                'Farmakologiya': [
                    { title: '1. Umumiy farmakokinetika', text: 'Dorilarning organizmga taʼsiri.', clinic: 'Klinik jihati: Dori vositalarining nojoʻya taʼsirlari.' }
                ]
            }
        };

        function showSubjects(course) {
            document.getElementById('view-courses').classList.add('hidden');
            document.getElementById('view-subjects').classList.remove('hidden');
            document.getElementById('title-subjects').innerText = course.toUpperCase();
            
            let list = document.getElementById('list-subjects');
            list.innerHTML = '';
            for (let sub in data[course]) {
                list.innerHTML += `<div class="card clickable" onclick="showTopics('${course}', '${sub}')"><h3>${sub}</h3><p>Muvofiq bo'limlarni ko'rish →</p></div>`;
            }
        }

        function showTopics(course, subject) {
            document.getElementById('view-subjects').classList.add('hidden');
            document.getElementById('view-topics').classList.remove('hidden');
            document.getElementById('title-topics').innerText = subject;
            
            let list = document.getElementById('list-topics');
            list.innerHTML = '';
            data[course][subject].forEach(topic => {
                if(topic.type === 'header') {
                    list.innerHTML += `<div class="section-title"><b>${topic.title}</b></div>`;
                } else {
                    list.innerHTML += `
                        <div class="card">
                            <h3 style="color:#40a9ff; text-align: left; font-size: 16px;">${topic.title}</h3>
                            <p>${topic.text}</p>
                            <div class="clinic"><b>Klinik jihati:</b> ${topic.clinic}</div>
                        </div>`;
                }
            });
        }

        function goBack(id) {
            document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }
    </script>
</body>
</html>
