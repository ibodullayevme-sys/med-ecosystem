<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Med Hub</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 16px; margin: 0; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h2 { color: #38bdf8; margin: 0 0 5px 0; font-size: 22px; }
        .header p { color: #94a3b8; font-size: 13px; margin: 0; }
        
        .card { background: #1e293b; padding: 16px; border-radius: 14px; margin-bottom: 12px; border: 1px solid #334155; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card:hover { border-color: #38bdf8; background: #273548; }
        .card h3 { color: #f1f5f9; margin: 0 0 6px 0; font-size: 18px; }
        .card p { color: #cbd5e1; font-size: 13px; margin: 0; line-height: 1.4; }
        
        .hidden { display: none; }
        .back-btn { color: #38bdf8; margin-bottom: 15px; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; font-size: 14px; }
        
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; padding: 16px; box-sizing: border-box; backdrop-filter: blur(4px); }
        .modal-content { background: #1e293b; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; padding: 20px; border-radius: 16px; border: 1px solid #38bdf8; position: relative; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3); }
        .close-btn { position: absolute; top: 12px; right: 16px; font-size: 28px; color: #f87171; cursor: pointer; font-weight: bold; background: none; border: none; z-index: 10000; padding: 5px 10px; }
        
        .conspect-box { background: #0f172a; padding: 14px; border-radius: 10px; margin-top: 12px; border-left: 4px solid #fbbf24; font-size: 14px; line-height: 1.6; color: #e2e8f0; }
        .clinic { color: #f87171; font-size: 13px; margin-top: 12px; border-left: 3px solid #f87171; padding-left: 10px; background: rgba(248, 113, 113, 0.05); padding-top: 6px; padding-bottom: 6px; border-radius: 0 8px 8px 0; }
        .usmle { color: #4ade80; font-size: 13px; margin-top: 8px; border-left: 3px solid #4ade80; padding-left: 10px; background: rgba(74, 222, 128, 0.05); padding-top: 6px; padding-bottom: 6px; border-radius: 0 8px 8px 0; }
    </style>
</head>
<body>

    <!-- Kurslar -->
    <div id="view-courses">
        <div class="header">
            <h2>Med Hub</h2>
            <p>O'quv kurslari va konspektlar bazasi</p>
        </div>
        <div class="card" onclick="openCourse('1-Kurs', ['Anatomiya', 'Histologiya', 'Tibbiy kimyo', 'Lotin tili'])">
            <h3>1-Kurs</h3>
            <p>Anatomiya, Histologiya, Tibbiy kimyo, Lotin tili</p>
        </div>
        <div class="card" onclick="openCourse('2-Kurs', ['Biokimyo', 'Normal fiziologiya', 'Mikrobiologiya'])">
            <h3>2-Kurs</h3>
            <p>Biokimyo, Normal fiziologiya, Mikrobiologiya</p>
        </div>
        <div class="card" onclick="openCourse('3-Kurs', ['Patologik anatomiya', 'Patofiziologiya', 'Farmakologiya'])">
            <h3>3-Kurs</h3>
            <p>Pat. anatomiya, Patofiziologiya, Farmakologiya</p>
        </div>
    </div>

    <!-- Fanlar -->
    <div id="view-subjects" class="hidden">
        <div class="back-btn" onclick="goBack('view-courses')">← Kurslarga qaytish</div>
        <h2 id="title-subjects" style="color: #38bdf8; text-align: center; margin-bottom: 15px;"></h2>
        <div id="list-subjects"></div>
    </div>

    <!-- Modal -->
    <div id="modal-conspect" class="modal hidden" onclick="handleModalClick(event)">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <h2 id="modal-title" style="color: #fbbf24; text-align: left; font-size: 18px; border-bottom: 1px solid #334155; padding-bottom: 10px; margin-top: 0; padding-right: 30px;"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script>
        function openCourse(courseName, subjects) {
            document.getElementById('view-courses').classList.add('hidden');
            document.getElementById('view-subjects').classList.remove('hidden');
            document.getElementById('title-subjects').innerText = courseName;
            
            let list = document.getElementById('list-subjects');
            list.innerHTML = '';
            
            subjects.forEach(sub => {
                list.innerHTML += `
                    <div class="card" onclick="openTopic('${sub}')">
                        <h3>${sub}</h3>
                        <p>Konspektni ochish →</p>
                    </div>`;
            });
        }

        function openTopic(subjectName) {
            let topic = {
                title: subjectName + ' boʻyicha konspekt',
                details: '• Bu yerda ' + subjectName + ' fanining toʻliq konspekt matnlari joylashadi.<br>• Barcha asosiy mexanizmlar va taʼriflar kiritilgan.',
                clinic: 'Klinik ahamiyati: Amaliyotda qoʻllaniladigan muhim belgilar va patologik holatlar.',
                usmle: 'USMLE testlari uchun muhim eslatma va kalit tushunchalar.'
            };

            document.getElementById('modal-title').innerText = topic.title;
            document.getElementById('modal-body').innerHTML = `
                <div class="conspect-box"><b>Konspekt:</b><br>${topic.details}</div>
                <div class="clinic"><b>Klinik jihati:</b> ${topic.clinic}</div>
                <div class="usmle"><b>USMLE:</b> ${topic.usmle}</div>
            `;
            document.getElementById('modal-conspect').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('modal-conspect').classList.add('hidden');
        }

        // Qora fonning o'zi bosilganda ham yopilishi uchun
        function handleModalClick(event) {
            if (event.target.id === 'modal-conspect') {
                closeModal();
            }
        }

        function goBack(viewId) {
            document.querySelectorAll('body > div').forEach(div => div.classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
        }
    </script>
</body>
</html>
